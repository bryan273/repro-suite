<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Paperlit has moved</title>
<link rel="icon" href="/paperlit/favicon.svg">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;background:#f7f7fb;color:#12122a}main{max-width:420px;padding:32px;text-align:center}a{color:#4f3fe6;font-weight:600}</style>
</head>
<body>
<main>
<h1 style="font-size:24px;margin:0 0 8px">Paperlit has moved</h1>
<p style="margin:0 0 16px;color:#555">This page is retired. You are being taken to the new site.</p>
<p><a id="go" href="/paperlit/">Open Paperlit</a></p>
</main>
<noscript><meta http-equiv="refresh" content="0;url=/paperlit/"></noscript>
<script>
(function(){
var N='/paperlit',p=location.pathname.replace(/^\/repro-suite\/?/,'').split('/').filter(Boolean),a=p[0]||'',r=p.slice(1),q=location.search,h=location.hash,to='/';
var qs=new URLSearchParams(q);
if(a==='explainer'){
  if(r[0]==='abs'&&r[1])to='/app/new?url='+encodeURIComponent(r[1]),q='';
  else if(r[0]==='account')to='/app/account';
  else if(r[0]==='console')to='/app/admin';
  else if(r[0]==='privacy'||r[0]==='terms')to='/'+r[0];
  else if(!r.length&&qs.get('v')&&!qs.get('job'))to='/app/new?url='+encodeURIComponent(qs.get('v')),q='';
  else if(!r.length)to='/';
  else q='',h='';
}else if(a==='hub'){
  if(r[0]==='console')to='/app/admin';else if(r[0]==='privacy'||r[0]==='terms')to='/'+r[0];else to='/';
  q='';h='';
}else if(a==='reading'){
  to=r[0]==='s'&&r[1]?'/app/read/s/'+encodeURIComponent(r[1]):'/app/read';q='';h='';
}else if(a==='lite'||a==='repro'){to='/app/check';q='';h='';}
else if(a==='desk'){to='/app';q='';h='';}
else{to='/';q='';h='';}
var u=N+to+(to.indexOf('?')>-1&&q?'&'+q.slice(1):q)+h;
location.replace(u);
document.getElementById('go').href=u;
})();
</script>
</body>
</html>
